workflows:
  ios-release:
    name: iOS Release to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gripcoach.app
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id) --type IOS_APP_STORE
      - name: Use signing profiles
        script: |
          keychain add-certificates
      - name: Set up Xcode project settings
        script: |
          cd gripcoach
          xcode-project use-profiles
      - name: Get Flutter dependencies
        script: |
          cd gripcoach
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd gripcoach/ios
          pod install
      - name: Build iOS
        script: |
          cd gripcoach
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - gripcoach/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - GripCoach Testers
