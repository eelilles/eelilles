name: gripcoach
description: Teaching/coaching app for new drivers that visualizes traction and stopping distance.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Sensors
  sensors_plus: ^4.0.2

  # Location/GPS for speed
  geolocator: ^11.0.0

  # Local storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # Math utilities
  vector_math: ^2.1.4

  # UUID for session IDs
  uuid: ^4.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
